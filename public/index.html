<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 热点 · 每日 GitHub 热门项目</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0e16;
    --bg-2: #0e1320;
    --card: #121826;
    --card-hover: #161d2e;
    --text: #e8ecf3;
    --sub: #8b95a7;
    --line: #232c3d;
    --hot: #ff5a36;          /* 热点强调色：暖橙红 */
    --hot-soft: rgba(255,90,54,.14);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  /* 背景：深色 + 极淡网格纹理 + 顶部橙色光晕（记忆点） */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(900px 420px at 50% -120px, rgba(255,90,54,.18), transparent 70%),
      linear-gradient(180deg, var(--bg-2), var(--bg) 38%);
  }
  body::after {
    content: "";
    position: fixed; inset: 0; z-index: -1; opacity: .5;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 0%, #000 0%, transparent 75%);
  }

  /* ===== Hero ===== */
  header {
    position: relative;
    max-width: 1180px; margin: 0 auto;
    padding: 64px 24px 30px;
  }
  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--hot); margin-bottom: 18px;
  }
  .kicker .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--hot);
    box-shadow: 0 0 0 0 rgba(255,90,54,.6); animation: pulse 2.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,90,54,.55); }
    70% { box-shadow: 0 0 0 12px rgba(255,90,54,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,90,54,0); }
  }
  header h1 {
    margin: 0;
    font-family: "Noto Serif SC", serif; font-weight: 900;
    font-size: clamp(38px, 6vw, 68px); line-height: 1.04; letter-spacing: -.01em;
  }
  header h1 .ai { color: var(--hot); }
  header .lede {
    margin: 16px 0 0; max-width: 620px;
    color: var(--sub); font-size: 16px;
  }
  .updated {
    margin-top: 22px; display: inline-flex; align-items: center; gap: 9px;
    font-family: "JetBrains Mono", monospace; font-size: 13px;
    color: #cdd5e3; background: var(--hot-soft);
    border: 1px solid rgba(255,90,54,.35);
    padding: 7px 14px; border-radius: 999px;
  }
  .updated .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399;
    box-shadow: 0 0 0 3px rgba(52,211,153,.22); }

  /* ===== 工具栏 ===== */
  .toolbar {
    max-width: 1180px; margin: 26px auto 0; padding: 0 24px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    position: sticky; top: 0; z-index: 30;
    padding-top: 14px; padding-bottom: 14px;
    background: linear-gradient(180deg, var(--bg) 62%, rgba(10,14,22,0));
    backdrop-filter: blur(6px);
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 auto; }
  .filters button {
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    padding: 7px 15px; border-radius: 999px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: all .18s ease; white-space: nowrap;
  }
  .filters button:hover { color: var(--text); border-color: #364257; }
  .filters button.active {
    background: var(--hot); color: #fff; border-color: var(--hot);
    box-shadow: 0 4px 16px rgba(255,90,54,.35);
  }
  .toolbar .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar select, .toolbar input {
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    font-size: 13px; background: var(--card); color: var(--text); font-family: inherit;
    transition: border-color .18s, box-shadow .18s;
  }
  .toolbar select { cursor: pointer; }
  .toolbar input { min-width: 210px; }
  .toolbar input::placeholder { color: #5c6678; }
  .toolbar input:focus, .toolbar select:focus {
    outline: none; border-color: var(--hot);
    box-shadow: 0 0 0 3px var(--hot-soft);
  }

  /* ===== 卡片网格 ===== */
  .grid {
    max-width: 1180px; margin: 0 auto; padding: 22px 24px 70px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px;
  }
  .card {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--card), #0f1622);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 20px 18px;
    display: flex; flex-direction: column; gap: 12px;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    animation: rise .55s cubic-bezier(.21,.7,.4,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }
  .card::before { /* 左侧热度光带 */
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--hot), transparent);
    opacity: .0; transition: opacity .2s ease;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: rgba(255,90,54,.55);
    box-shadow: 0 16px 44px rgba(0,0,0,.45), 0 0 0 1px rgba(255,90,54,.35);
    background: linear-gradient(180deg, var(--card-hover), #101827);
  }
  .card:hover::before { opacity: 1; }

  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .cat { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--sub); }
  .cat .swatch { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,255,255,.04); }
  .rank {
    font-family: "JetBrains Mono", monospace; font-weight: 700;
    font-size: 15px; letter-spacing: -.02em;
  }
  .card h3 { margin: 2px 0 0; font-size: 17px; line-height: 1.32; font-weight: 700; }
  .card h3 a { color: var(--text); text-decoration: none; transition: color .18s; }
  .card h3 a:hover { color: var(--hot); }
  .summary {
    font-size: 14px; color: #c4ccda; margin: 0; line-height: 1.6;
  }
  .desc {
    font-size: 13px; color: var(--sub); margin: 0;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--sub); margin-top: 2px; }
  .stars { font-family: "JetBrains Mono", monospace; color: #f4d58d; font-weight: 500; white-space: nowrap; }
  .lang { display: inline-flex; align-items: center; gap: 5px; }
  .lang .d { width: 8px; height: 8px; border-radius: 50%; background: #58a6ff; }
  .date { margin-left: auto; white-space: nowrap; }

  .heat-wrap { display: flex; align-items: center; gap: 10px; }
  .heat { flex: 1; height: 6px; background: #1b2231; border-radius: 4px; overflow: hidden; }
  .heat-bar { height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #ff8a3d, var(--hot));
    box-shadow: 0 0 10px rgba(255,90,54,.5); }
  .heat-num { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--hot); font-weight: 700; white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; background: #1a2233; color: #9aa6ba; padding: 3px 9px; border-radius: 7px; border: 1px solid var(--line); }

  .empty { text-align: center; color: var(--sub); padding: 70px 20px; font-size: 15px; grid-column: 1/-1; }
  footer { text-align: center; color: #5c6678; font-size: 12.5px; padding: 0 20px 50px; font-family: "JetBrains Mono", monospace; }

  @media (max-width: 560px) {
    header { padding-top: 44px; }
    .grid { grid-template-columns: 1fr; }
    .toolbar input { min-width: 100%; }
  }
</style>
</head>
<body>
<header>
  <span class="kicker"><span class="pulse"></span>DAILY AI HOTSPOT · GITHUB</span>
  <h1><span class="ai">AI</span> 热点榜单</h1>
  <p class="lede" id="subtitle">每天聚合 GitHub 上最热门的 AI 项目，按领域分类、生成中文摘要，帮你一眼抓住重点。</p>
  <div class="updated"><span class="dot"></span><span id="updated-text">最后更新：加载中…</span></div>
</header>

<div class="toolbar">
  <div class="filters" id="filters"></div>
  <div class="controls">
    <select id="sort">
      <option value="heat">按热度排序</option>
      <option value="time">按最新排序</option>
    </select>
    <input id="search" type="text" placeholder="搜索标题 / 摘要 / 标签…" />
  </div>
</div>

<div class="grid" id="grid"></div>
<footer>数据来自 GitHub 公开 API · 摘要由 AI / 缓存生成，仅供参考</footer>

<script>
let DATA = { items: [] };
let state = { cat: "all", sort: "heat", q: "" };

// 分类配色（深色背景友好，与 fetch.py 的 CATEGORIES 顺序一致）
const CAT_COLOR = {
  "大模型 / LLM": "#5b9cff",
  "智能体 / Agent": "#c084fc",
  "多模态 / 视觉": "#ff7eb6",
  "检索增强 / RAG": "#2dd4bf",
  "训练 / 微调": "#fbbf24",
  "推理 / 部署": "#34d399",
  "语音 / 音频": "#ff6b6b",
  "框架 / 工具": "#94a3b8",
  "其他": "#cbd5e1",
};
const DEFAULT_CATS = ["大模型 / LLM", "智能体 / Agent", "多模态 / 视觉", "检索增强 / RAG",
                      "训练 / 微调", "推理 / 部署", "语音 / 音频", "框架 / 工具", "其他"];

// 把 data.json 里的 UTC 时间转成北京时间，并给出相对“多久前”
function fmtBeijing(iso) {
  if (!iso) return "未知";
  const d = new Date(iso + "Z"); // 视为 UTC
  if (isNaN(d.getTime())) return iso;
  const bj = new Date(d.getTime() + 8 * 3600 * 1000); // UTC+8
  const p = n => String(n).padStart(2, "0");
  const s = `${bj.getUTCFullYear()}-${p(bj.getUTCMonth() + 1)}-${p(bj.getUTCDate())} `
          + `${p(bj.getUTCHours())}:${p(bj.getUTCMinutes())}`;
  const diff = Date.now() - bj.getTime();
  let rel;
  if (diff >= 0) {
    const h = Math.floor(diff / 3600000);
    rel = h < 1 ? "刚刚" : h < 24 ? `${h} 小时前` : `${Math.floor(h / 24)} 天前`;
  } else {
    rel = "即将更新";
  }
  return `${s}（北京时间）· ${rel}`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function load() {
  try {
    const res = await fetch("./data.json", { cache: "no-store" });
    DATA = await res.json();
  } catch (e) {
    document.getElementById("grid").innerHTML =
      '<div class="empty">未能加载 data.json，请先运行聚合脚本生成数据。</div>';
    return;
  }
  document.getElementById("subtitle").textContent =
    `每天聚合 GitHub 热门 AI 项目 · 当前共 ${DATA.count || 0} 条，按领域分类`;
  document.getElementById("updated-text").textContent = "最后更新：" + fmtBeijing(DATA.generated_at || "");
  buildFilters();
  render();
}

function buildFilters() {
  const cats = DATA.categories || DEFAULT_CATS;
  const present = new Set(DATA.items.map(i => i.category));
  const order = cats.filter(c => present.has(c));
  const box = document.getElementById("filters");
  box.innerHTML = "";
  const mk = (label, val, active) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.dataset.cat = val;
    if (active) b.classList.add("active");
    box.appendChild(b);
  };
  mk("全部", "all", state.cat === "all");
  order.forEach(c => mk(c, c, state.cat === c));
}

function heatColor(score) {
  // 热度越高越偏橙红，越低越偏灰蓝
  return score >= 0.85 ? "#ff5a36" : score >= 0.6 ? "#ff8a3d" : "#ffb066";
}

function render() {
  let items = DATA.items.filter(it => state.cat === "all" || it.category === state.cat);
  if (state.q) {
    const q = state.q.toLowerCase();
    items = items.filter(it =>
      (it.title + " " + (it.category || "") + " " + (it.summary || "") + " " + (it.description || ""))
        .toLowerCase().includes(q));
  }
  if (state.sort === "heat") items.sort((a, b) => b.heat_score - a.heat_score);
  else items.sort((a, b) => (b.published || "").localeCompare(a.published || ""));

  const grid = document.getElementById("grid");
  if (!items.length) { grid.innerHTML = '<div class="empty">没有匹配的内容。</div>'; return; }

  grid.innerHTML = items.map((it, i) => {
    const w = Math.min(100, Math.round(it.heat_score * 100));
    const color = CAT_COLOR[it.category] || "#cbd5e1";
    const summary = it.summary ? `<p class="summary">${esc(it.summary)}</p>`
                               : `<p class="desc">${esc(it.description || "")}</p>`;
    const stars = (it.extra && it.extra.stars != null) ? `★ ${it.extra.stars.toLocaleString()}` : "";
    const lang = (it.extra && it.extra.language) ? `<span class="lang"><span class="d"></span>${esc(it.extra.language)}</span>` : "";
    const topics = (it.extra && it.extra.topics) ? it.extra.topics.slice(0, 2)
      .map(t => `<span class="tag">${esc(t)}</span>`).join("") : "";
    return `<article class="card" style="animation-delay:${Math.min(i * 45, 600)}ms">
      <div class="card-top">
        <span class="cat"><span class="swatch" style="background:${color}"></span>${esc(it.category)}</span>
        <span class="rank" style="color:${heatColor(it.heat_score)}">#${it.rank}</span>
      </div>
      <h3><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h3>
      ${summary}
      <div class="meta">
        <span class="stars">${stars}</span>
        ${lang}
        <span class="date">${it.published || ""}</span>
      </div>
      <div class="heat-wrap">
        <div class="heat"><div class="heat-bar" style="width:${w}%"></div></div>
        <span class="heat-num">热度 ${it.heat_score.toFixed(2)}</span>
      </div>
      <div class="tags">${topics}</div>
    </article>`;
  }).join("");
}

document.getElementById("filters").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  state.cat = e.target.dataset.cat;
  render();
});
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
document.getElementById("search").addEventListener("input", e => { state.q = e.target.value; render(); });

load();
</script>
</body>
</html>
