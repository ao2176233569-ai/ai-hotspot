<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 热点 · GitHub 趋势榜单</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  /* ============ 主题变量 ============ */
  :root, [data-theme="dark"] {
    --bg: #080b12;
    --bg-2: #0c111c;
    --surface: #111826;
    --surface-2: #0e1521;
    --card: #121a2a;
    --card-hover: #162034;
    --text: #e9edf5;
    --text-strong: #ffffff;
    --sub: #93a0b5;
    --faint: #5d6880;
    --line: #1e2738;
    --line-strong: #2a3650;
    --hot: #ff6a3d;
    --hot-2: #ffb347;
    --hot-soft: rgba(255,106,61,.12);
    --accent: #6ea8fe;
    --good: #34d399;
    --down: #94a3b8;
    --shadow: 0 18px 50px rgba(0,0,0,.5);
    --grid-line: rgba(255,255,255,.022);
    --glow: rgba(255,106,61,.16);
  }
  [data-theme="light"] {
    --bg: #f6f7fb;
    --bg-2: #eef1f7;
    --surface: #ffffff;
    --surface-2: #fbfcfe;
    --card: #ffffff;
    --card-hover: #ffffff;
    --text: #1b2333;
    --text-strong: #0a0f1c;
    --sub: #5a6679;
    --faint: #98a2b3;
    --line: #e6e9f0;
    --line-strong: #d3d9e4;
    --hot: #ef5a2a;
    --hot-2: #f08c1f;
    --hot-soft: rgba(239,90,42,.10);
    --accent: #2f6fed;
    --good: #0ca678;
    --down: #98a2b3;
    --shadow: 0 16px 44px rgba(31,45,80,.12);
    --grid-line: rgba(20,30,60,.03);
    --glow: rgba(239,90,42,.10);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    transition: background .4s ease, color .4s ease;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(1000px 460px at 50% -160px, var(--glow), transparent 70%),
      linear-gradient(180deg, var(--bg-2), var(--bg) 40%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; opacity: 1; pointer-events: none;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(circle at 50% -5%, #000 0%, transparent 78%);
            mask-image: radial-gradient(circle at 50% -5%, #000 0%, transparent 78%);
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ============ 顶栏 ============ */
  header.hero { position: relative; padding: 58px 0 16px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
  .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: .01em; }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--hot), var(--hot-2));
    box-shadow: 0 6px 18px var(--glow);
    display: grid; place-items: center; color: #fff; font-size: 15px;
  }
  .brand small { color: var(--faint); font-weight: 500; font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .12em; }
  .theme-toggle {
    border: 1px solid var(--line); background: var(--surface); color: var(--sub);
    width: 40px; height: 40px; border-radius: 11px; cursor: pointer; font-size: 17px;
    display: grid; place-items: center; transition: all .2s ease;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--line-strong); transform: translateY(-1px); }

  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .22em;
    text-transform: uppercase; color: var(--hot); margin-bottom: 16px;
  }
  .kicker .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--hot);
    box-shadow: 0 0 0 0 rgba(255,106,61,.6); animation: pulse 2.2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,106,61,.5); }
    70% { box-shadow: 0 0 0 12px rgba(255,106,61,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,106,61,0); }
  }
  h1.title {
    margin: 0; font-family: "Noto Serif SC", serif; font-weight: 900;
    font-size: clamp(40px, 6.4vw, 72px); line-height: 1.02; letter-spacing: -.015em; color: var(--text-strong);
  }
  h1.title .ai { background: linear-gradient(120deg, var(--hot), var(--hot-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .lede { margin: 18px 0 0; max-width: 660px; color: var(--sub); font-size: 16px; }
  .updated {
    margin-top: 22px; display: inline-flex; align-items: center; gap: 9px;
    font-family: "JetBrains Mono", monospace; font-size: 13px; color: #cdd5e3;
    background: var(--hot-soft); border: 1px solid color-mix(in srgb, var(--hot) 32%, transparent);
    padding: 7px 14px; border-radius: 999px;
  }
  [data-theme="light"] .updated { color: var(--text); }
  .updated .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }

  /* ============ 概览仪表盘 ============ */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 36px 0 8px; }
  .stat {
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px;
    position: relative; overflow: hidden;
  }
  .stat::before {
    content: ""; position: absolute; right: -20px; top: -20px; width: 80px; height: 80px;
    background: radial-gradient(circle, var(--glow), transparent 70%); opacity: .8;
  }
  .stat .label { font-size: 12.5px; color: var(--sub); display: flex; align-items: center; gap: 7px; }
  .stat .num {
    font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px;
    color: var(--text-strong); margin-top: 8px; letter-spacing: -.02em;
  }
  .stat .num .u { font-size: 14px; color: var(--faint); margin-left: 3px; }

  /* ============ 时间段：滑动分段控制器 ============ */
  .rangetabs {
    position: relative; display: flex; gap: 0; margin: 30px 0 0; padding: 5px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.20);
  }
  .rangetabs .thumb {
    position: absolute; top: 5px; bottom: 5px; left: 5px; z-index: 0;
    width: calc((100% - 10px) / 3); border-radius: 12px;
    background: linear-gradient(135deg, var(--hot), var(--hot-2));
    box-shadow: 0 8px 22px var(--glow), 0 0 22px color-mix(in srgb, var(--hot) 42%, transparent);
    transition: transform .34s cubic-bezier(.34,1.2,.4,1);
  }
  .rangetabs .thumb::before {
    content: ""; position: absolute; inset: 0; border-radius: 12px; pointer-events: none;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.42) 50%, transparent 65%);
    background-size: 250% 100%;
    animation: thumbSheen 3.6s ease-in-out infinite;
  }
  @keyframes thumbSheen {
    0%   { background-position: 180% 0; }
    100% { background-position: -80% 0; }
  }
  .rangetabs .thumb.flash { animation: thumbFlash .45s ease; }
  @keyframes thumbFlash {
    0%   { box-shadow: 0 8px 22px var(--glow), 0 0 10px color-mix(in srgb, var(--hot) 28%, transparent); }
    45%  { box-shadow: 0 8px 22px var(--glow), 0 0 36px color-mix(in srgb, var(--hot) 78%, transparent); }
    100% { box-shadow: 0 8px 22px var(--glow), 0 0 22px color-mix(in srgb, var(--hot) 42%, transparent); }
  }
  .rangetabs button {
    position: relative; z-index: 1; flex: 1 1 0; border: none; background: transparent; color: var(--sub);
    padding: 11px 8px; border-radius: 12px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    transition: color .28s ease;
  }
  .rangetabs button .ic { font-size: 17px; filter: grayscale(.2); transition: filter .28s ease, transform .28s ease; }
  .rangetabs button .tab-txt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.18; }
  .rangetabs button .tab-main { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .rangetabs button .tab-cap { font-size: 10.5px; font-weight: 500; opacity: .62; white-space: nowrap; transition: opacity .28s ease; }
  .rangetabs button:hover { color: var(--text); }
  .rangetabs button:not(.active):hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
  .rangetabs button.active .tab-main { text-shadow: 0 1px 12px rgba(255,255,255,.28); }
  .rangetabs button.active { color: #fff; }
  .rangetabs button.active .ic { filter: none; transform: scale(1.08); }
  .rangetabs button.active .tab-cap { opacity: .82; }

  /* ============ 语言筛选：主题化自定义下拉 ============ */
  .lang-filter { position: relative; }
  .lang-trigger {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; font-size: 13px;
    background: var(--card); color: var(--text);
    transition: border-color .18s, box-shadow .18s, background .18s, transform .18s;
  }
  .lang-trigger:hover { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .lang-filter.open .lang-trigger { border-color: var(--hot); box-shadow: 0 0 0 3px var(--hot-soft); }
  .lang-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; transition: background .18s; }
  .lang-trigger .caret { font-size: 10px; color: var(--faint); transition: transform .22s ease; }
  .lang-filter.open .lang-trigger .caret { transform: rotate(180deg); }
  .lang-pop {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 50; min-width: 210px; max-height: 290px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; padding: 6px;
    box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--line-strong) 50%, transparent);
    opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top right; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .lang-pop::-webkit-scrollbar { width: 7px; }
  .lang-pop::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
  .lang-filter.open .lang-pop { opacity: 1; transform: none; pointer-events: auto;
    box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--hot) 32%, transparent); }
  /* 分类下拉靠左展开（语言下拉靠右） */
  #catFilter .lang-pop { left: 0; right: auto; transform-origin: top left; }
  .lang-opt {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none;
    background: transparent; border-radius: 9px; font-size: 13px; color: var(--text);
    cursor: pointer; font-family: inherit; text-align: left; transition: background .15s ease;
  }
  .lang-opt:hover { background: var(--card-hover); }
  .lang-opt.active { background: var(--hot-soft); color: var(--hot); }
  .lang-opt .lo-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .lang-opt .lo-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lang-opt .lo-count { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--faint); }
  .lang-opt .lo-check { color: var(--hot); font-size: 12px; }
  .lang-opt { position: relative; }
  .lang-opt::before { content: ""; position: absolute; left: 3px; top: 7px; bottom: 7px; width: 3px; border-radius: 3px;
    background: transparent; transition: background .18s ease; }
  .lang-opt:hover::before, .lang-opt.active::before { background: linear-gradient(180deg, var(--hot), var(--hot-2)); }
  .lang-opt .lo-ic { font-size: 13px; flex: 0 0 auto; }
  .lang-filter.open .lang-opt { animation: optIn .26s cubic-bezier(.2,.7,.3,1) both; animation-delay: calc(var(--i, 0) * 26ms); }
  @keyframes optIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }

  /* ============ 工具栏 ============ */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    position: sticky; top: 0; z-index: 30; margin: 18px 0 0; padding: 14px 0;
    background: linear-gradient(180deg, var(--bg) 64%, transparent); backdrop-filter: blur(8px);
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 auto; }
  .filters button {
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: all .18s ease; white-space: nowrap;
  }
  .filters button:hover { color: var(--text); border-color: var(--line-strong); }
  .filters button.active {
    background: linear-gradient(135deg, var(--hot), var(--hot-2)); color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px var(--glow);
  }
  .controls { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  .controls select, .controls input {
    border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; font-size: 13px;
    background: var(--card); color: var(--text); font-family: inherit; transition: border-color .18s, box-shadow .18s;
  }
  .controls input { min-width: 220px; }
  .controls input::placeholder { color: var(--faint); }
  .controls input:focus, .controls select:focus { outline: none; border-color: var(--hot); box-shadow: 0 0 0 3px var(--hot-soft); }
  .btn-ghost {
    border: 1px solid var(--line); background: var(--card); color: var(--sub); padding: 9px 13px;
    border-radius: 11px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
    transition: all .18s ease; white-space: nowrap;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--line-strong); }

  /* ============ 卡片网格 ============ */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; margin: 18px 0 70px; }
  .card {
    position: relative; overflow: hidden; cursor: pointer;
    background: linear-gradient(180deg, var(--card), var(--surface-2));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 16px;
    display: flex; flex-direction: column; gap: 10px;
    transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease, background .22s ease;
    opacity: 0; transform: translateY(16px);
  }
  .card.in { opacity: 1; transform: none; }
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
    background: radial-gradient(420px 180px at 50% -40%, var(--glow), transparent 70%); opacity: 0; transition: opacity .25s ease;
  }
  .card:hover { transform: translateY(-5px); border-color: color-mix(in srgb, var(--hot) 45%, var(--line));
    box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--hot) 30%, transparent); }
  .card:hover::after { opacity: 1; }

  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .cat { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--sub); }
  .cat .swatch { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 3px color-mix(in srgb, var(--swatch,#888) 14%, transparent); background: var(--swatch,#888); }
  .rank { display: inline-flex; align-items: center; gap: 7px;
    font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 15px; letter-spacing: -.02em; color: var(--hot); }
  .rc { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; }
  .rc.up { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .rc.down { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); }

  .card h3 { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; color: var(--text-strong); }
  .card h3 a { color: inherit; text-decoration: none; }
  .summary { font-size: 14px; color: var(--text); margin: 0; line-height: 1.62; opacity: .92; }
  .desc { font-size: 13px; color: var(--sub); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .meta { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--sub); flex-wrap: wrap; }
  .stars { font-family: "JetBrains Mono", monospace; color: #f4d58d; font-weight: 600; white-space: nowrap; }
  [data-theme="light"] .stars { color: #b8821a; }
  .lang { display: inline-flex; align-items: center; gap: 5px; }
  .lang .d { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .forks { font-family: "JetBrains Mono", monospace; color: var(--sub); font-weight: 600; white-space: nowrap; }

  /* 主视觉：周期新增 star */
  .gain {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--hot-soft); border: 1px solid color-mix(in srgb, var(--hot) 28%, transparent);
    border-radius: 12px; padding: 10px 13px;
  }
  .gain .big { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 22px; color: var(--hot); letter-spacing: -.02em; }
  .gain .lbl { font-size: 12px; color: var(--sub); }
  .gain .fork { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 13px; color: var(--text); }

  .heat-wrap { display: flex; align-items: center; gap: 10px; }
  .heat { flex: 1; height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .heat-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--hot-2), var(--hot)); box-shadow: 0 0 10px var(--glow); }
  .heat-num { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--hot); font-weight: 700; white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--sub);
    padding: 3px 9px; border-radius: 7px; border: 1px solid var(--line); }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 7px; letter-spacing: .02em; }
  .badge.fire { background: var(--hot-soft); color: var(--hot); border: 1px solid color-mix(in srgb, var(--hot) 35%, transparent); }
  .badge.new { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); }
  .badge.fire small { font-weight: 500; opacity: .82; }

  /* 展开详情 */
  .detail { display: none; border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 12px; gap: 12px; flex-direction: column; }
  .card.open .detail { display: flex; }
  .detail .full { font-size: 13.5px; color: var(--sub); margin: 0; line-height: 1.6; }
  .detail .acts { display: flex; gap: 9px; flex-wrap: wrap; }
  .detail .acts a { font-size: 12.5px; padding: 7px 13px; border-radius: 10px; text-decoration: none;
    border: 1px solid var(--line-strong); color: var(--text); background: var(--surface); transition: all .18s ease; }
  .detail .acts a.primary { background: linear-gradient(135deg, var(--hot), var(--hot-2)); color: #fff; border-color: transparent; }
  .detail .acts a:hover { transform: translateY(-1px); border-color: var(--hot); }

  .skeleton .sk-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--line) 25%, color-mix(in srgb, var(--line) 50%, var(--surface)) 37%, var(--line) 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; }
  @keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .skeleton { pointer-events: none; }
  .skeleton .sk-title { height: 18px; width: 62%; margin-top: 6px; }

  footer { text-align: center; color: var(--faint); font-size: 12.5px; padding: 0 20px 50px; font-family: "JetBrains Mono", monospace; }
  .empty { text-align: center; color: var(--sub); padding: 70px 20px; font-size: 15px; grid-column: 1/-1; }

  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) {
    header.hero { padding-top: 40px; }
    .grid { grid-template-columns: 1fr; }
    .controls input { min-width: 100%; }
    .rangetabs button { padding: 10px 4px; gap: 6px; }
    .rangetabs button .tab-cap { display: none; }
    .rangetabs button .tab-main { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; opacity: 1; transform: none; }
    .kicker .pulse, .skeleton .sk-line { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="topbar">
      <div class="brand">
        <span class="logo">AI</span>
        <div>AI 热点榜单<br><small>HOTSPOT · GITHUB TRENDING</small></div>
      </div>
      <button class="theme-toggle" id="themeToggle" title="切换深浅主题" aria-label="切换主题">◐</button>
    </div>
    <span class="kicker"><span class="pulse"></span>AI GITHUB TRENDING</span>
    <h1 class="title"><span class="ai">AI</span> 热点趋势榜</h1>
    <p class="lede" id="subtitle">每天聚合 GitHub 上最热门的 AI 项目，按「规模归一动量 + fork 增速 + 新鲜度」复合打分排序，帮你一眼抓住正在爆发的新星。</p>
    <div class="updated"><span class="dot"></span><span id="updated-text">最后更新：加载中…</span></div>

    <div class="stats" id="stats">
      <div class="stat"><div class="label">📦 收录项目</div><div class="num" data-stat="total">0</div></div>
      <div class="stat"><div class="label">🏷️ 覆盖领域</div><div class="num" data-stat="cats">0</div></div>
      <div class="stat"><div class="label">🔥 最热分类</div><div class="num" data-stat="topcat" style="font-size:18px">—</div></div>
      <div class="stat"><div class="label">⭐ 本档新增</div><div class="num" data-stat="newstars">0</div></div>
    </div>

    <div class="rangetabs" id="rangetabs">
      <span class="thumb" id="rangeThumb"></span>
      <button data-range="day" class="active">
        <span class="ic">🔥</span>
        <span class="tab-txt"><span class="tab-main">当天最火</span><span class="tab-cap">今日爆发</span></span>
      </button>
      <button data-range="month">
        <span class="ic">📅</span>
        <span class="tab-txt"><span class="tab-main">当月最火</span><span class="tab-cap">本月热度</span></span>
      </button>
      <button data-range="year">
        <span class="ic">🏆</span>
        <span class="tab-txt"><span class="tab-main">当年最火</span><span class="tab-cap">年度爆款</span></span>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="controls">
      <div class="lang-filter" id="catFilter">
        <button class="lang-trigger" id="catTrigger" type="button">
          <span class="lang-dot" id="catDot"></span>
          <span class="lang-label" id="catLabel">全部分类</span>
          <span class="caret">▾</span>
        </button>
        <div class="lang-pop" id="catPop" role="listbox"></div>
      </div>
      <div class="lang-filter" id="sortFilter">
        <button class="lang-trigger" id="sortTrigger" type="button">
          <span class="lang-dot" id="sortDot"></span>
          <span class="lang-label" id="sortLabel">按趋势分</span>
          <span class="caret">▾</span>
        </button>
        <div class="lang-pop" id="sortPop" role="listbox"></div>
      </div>
      <div class="lang-filter" id="langFilter">
        <button class="lang-trigger" id="langTrigger" type="button">
          <span class="lang-dot" id="langDot"></span>
          <span class="lang-label" id="langLabel">全部语言</span>
          <span class="caret">▾</span>
        </button>
        <div class="lang-pop" id="langPop" role="listbox"></div>
      </div>
      <input id="search" type="text" placeholder="搜索标题 / 摘要 / 标签…" />
      <button class="btn-ghost" id="exportBtn" title="导出当前榜单为 Markdown">⬇ 导出</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <footer>数据来自 GitHub 公开 API · 趋势分由 star/fork 增量与库龄加权计算，仅供参考</footer>
</div>

<script>
let DATA = { ranges: { day: [], month: [], year: [] }, categories: [], generated_at: "" };
let state = { range: "day", cat: "all", lang: "all", sort: "trend", q: "" };

function currentItems(){ return DATA.ranges[state.range] || []; }
const RANGE_LABEL = { day: "当天", month: "当月", year: "当年" };
const RANGE_GAIN_LBL = { day: "当日新增", month: "当月新增", year: "当年新增" };

const CAT_COLOR = {
  "大模型 / LLM": "#5b9cff", "智能体 / Agent": "#c084fc", "多模态 / 视觉": "#ff7eb6",
  "检索增强 / RAG": "#2dd4bf", "训练 / 微调": "#fbbf24", "推理 / 部署": "#34d399",
  "语音 / 音频": "#ff6b6b", "框架 / 工具": "#94a3b8", "其他": "#cbd5e1",
};
const DEFAULT_CATS = ["大模型 / LLM","智能体 / Agent","多模态 / 视觉","检索增强 / RAG","训练 / 微调","推理 / 部署","语音 / 音频","框架 / 工具","其他"];

/* ---- 主题：localStorage 持久化 ---- */
(function initTheme(){
  try {
    const t = localStorage.getItem("aihot-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch(e){}
  document.getElementById("themeToggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", cur);
    try { localStorage.setItem("aihot-theme", cur); } catch(e){}
  });
})();

function fmtBeijing(iso){
  if(!iso) return "未知";
  const d = new Date(iso + "Z");
  if(isNaN(d.getTime())) return iso;
  const bj = new Date(d.getTime() + 8*3600*1000);
  const p = n => String(n).padStart(2,"0");
  const s = `${bj.getUTCFullYear()}-${p(bj.getUTCMonth()+1)}-${p(bj.getUTCDate())} ${p(bj.getUTCHours())}:${p(bj.getUTCMinutes())}`;
  const diff = Date.now() - bj.getTime();
  let rel = diff>=0 ? (diff<3600000 ? "刚刚" : diff<86400000 ? `${Math.floor(diff/3600000)} 小时前` : `${Math.floor(diff/86400000)} 天前`) : "即将更新";
  return `${s}（北京时间）· ${rel}`;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtStars(n){
  if(n==null) return "";
  if(n>=1000) return (n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,"") + "k";
  return String(n);
}

/* ---- 数字跳动 ---- */
function countUp(el, target, suffix=""){
  const dur = 900; const start = performance.now(); const from = 0;
  function step(now){
    const t = Math.min(1, (now-start)/dur);
    const e = 1 - Math.pow(1-t, 3);
    const v = Math.round(from + (target-from)*e);
    el.firstChild ? el.childNodes[0].nodeValue = v.toLocaleString() : el.textContent = v.toLocaleString();
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

async function load(){
  renderSkeletons(12);
  try {
    const res = await fetch("./data.json", { cache: "no-store" });
    DATA = await res.json();
  } catch(e){
    document.getElementById("grid").innerHTML = '<div class="empty">未能加载 data.json，请先运行聚合脚本生成数据。</div>';
    return;
  }
  if(!DATA.ranges) DATA.ranges = { day: [], month: [], year: [] };
  document.getElementById("updated-text").textContent = "最后更新：" + fmtBeijing(DATA.generated_at || "");
  syncRangeUI();
  buildStats();
  buildCatFilter();
  buildLangFilter();
  buildSortFilter();
  render();
}

function buildStats(){
  const items = currentItems();
  const cats = new Set(items.map(i=>i.category));
  const tally = {};
  let newStars = 0;
  items.forEach(i=>{
    tally[i.category]=(tally[i.category]||0)+1;
    const d = (i.deltas && i.deltas[state.range]) || {};
    if(d.stars) newStars += d.stars;
  });
  let topcat="—", max=-1;
  Object.entries(tally).forEach(([c,n])=>{ if(n>max){max=n; topcat=c;} });

  countUp(document.querySelector('[data-stat="total"]'), items.length);
  countUp(document.querySelector('[data-stat="cats"]'), cats.size);
  document.querySelector('[data-stat="topcat"]').textContent = topcat;
  const nsEl = document.querySelector('[data-stat="newstars"]');
  countUp(nsEl, newStars);
  nsEl.innerHTML = nsEl.textContent + '<span class="u">⭐</span>';
}

function buildCatFilter(){
  const cats = DATA.categories || DEFAULT_CATS;
  const present = new Set(currentItems().map(i=>i.category));
  const counts = {};
  currentItems().forEach(i=>{ if(i.category) counts[i.category]=(counts[i.category]||0)+1; });
  const order = cats.filter(c=>present.has(c));
  const pop = document.getElementById("catPop"); pop.innerHTML="";
  const mkOpt=(name,color,count,val)=>{
    const o=document.createElement("button");
    o.type="button"; o.className="lang-opt"+(state.cat===val?" active":""); o.dataset.cat=val;
    o.innerHTML=`<span class="lo-dot" style="background:${color}"></span>`+
      `<span class="lo-name">${esc(name)}</span>`+
      (count!=null?`<span class="lo-count">${count}</span>`:"")+
      (state.cat===val?`<span class="lo-check">✓</span>`:"");
    pop.appendChild(o);
  };
  mkOpt("全部分类","var(--faint)",null,"all");
  order.forEach(c=>mkOpt(c, CAT_COLOR[c]||"#cbd5e1", counts[c], c));
  updateCatTrigger();
}
function updateCatTrigger(){
  const label=document.getElementById("catLabel");
  const dot=document.getElementById("catDot");
  if(state.cat==="all"){ label.textContent="全部分类"; dot.style.background="var(--faint)"; }
  else { label.textContent=state.cat; dot.style.background=CAT_COLOR[state.cat]||"#cbd5e1"; }
}

const LANG_COLORS = {
  "Python":"#3572A5","JavaScript":"#f1e05a","TypeScript":"#3178c6","C++":"#f34b7d","C":"#555555",
  "C#":"#178600","Rust":"#dea584","Go":"#00ADD8","Java":"#b07219","HTML":"#e34c26",
  "Jupyter Notebook":"#DA5B0B","Jupyter":"#DA5B0B","Shell":"#89e051","Vue":"#41b883","R":"#198CE7",
  "Ruby":"#701516","Swift":"#F05138","Kotlin":"#A97BFF","Dart":"#00B4AB","Lua":"#000080",
  "Zig":"#ec915c","Scala":"#c22d40","PHP":"#4F5D95","CSS":"#563d7c","Makefile":"#427819",
  "Cuda":"#3A4E3A","Objective-C":"#438eff","PowerShell":"#012456","Elixir":"#6e4a7e","Haskell":"#5e5086"
};
function langColor(l){ return LANG_COLORS[l] || "#9aa4b2"; }

function buildLangFilter(){
  const counts={};
  ["day","month","year"].forEach(k=>(DATA.ranges[k]||[]).forEach(i=>{ const l=i.extra&&i.extra.language; if(l) counts[l]=(counts[l]||0)+1; }));
  const langs=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const pop=document.getElementById("langPop"); pop.innerHTML="";
  const mkOpt=(name,color,count,val)=>{
    const o=document.createElement("button");
    o.type="button"; o.className="lang-opt"+(state.lang===val?" active":""); o.dataset.lang=val;
    o.innerHTML=`<span class="lo-dot" style="background:${color}"></span>`+
      `<span class="lo-name">${esc(name)}</span>`+
      (count!=null?`<span class="lo-count">${count}</span>`:"")+
      (state.lang===val?`<span class="lo-check">✓</span>`:"");
    pop.appendChild(o);
  };
  mkOpt("全部语言","var(--faint)",null,"all");
  langs.forEach(l=>mkOpt(l, langColor(l), counts[l], l));
  updateLangTrigger();
}
function updateLangTrigger(){
  const label=document.getElementById("langLabel");
  const dot=document.getElementById("langDot");
  if(state.lang==="all"){ label.textContent="全部语言"; dot.style.background="var(--faint)"; }
  else { label.textContent=state.lang; dot.style.background=langColor(state.lang); }
}

/* ---- 排序：与分类/语言同款色点下拉 ---- */
const SORT_OPTIONS = [
  { value:"trend", label:"按趋势分（默认）", short:"按趋势分", icon:"🔥", color:"var(--hot)" },
  { value:"gain",  label:"按本档新增 Star",  short:"本档新增", icon:"⭐", color:"#f4d58d" },
  { value:"stars", label:"按 Star 总量",     short:"Star 总量", icon:"🌟", color:"#ffb347" },
  { value:"forks", label:"按 Fork 总量",     short:"Fork 总量", icon:"🍴", color:"#b388ff" },
  { value:"time",  label:"按最近更新",       short:"最近更新", icon:"🕒", color:"var(--accent)" },
];
function buildSortFilter(){
  const pop=document.getElementById("sortPop"); pop.innerHTML="";
  SORT_OPTIONS.forEach((o,idx)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="lang-opt"+(state.sort===o.value?" active":""); b.dataset.sort=o.value;
    b.style.setProperty("--i", idx);
    b.innerHTML=`<span class="lo-dot" style="background:${o.color}"></span>`+
      `<span class="lo-ic">${o.icon}</span>`+
      `<span class="lo-name">${esc(o.label)}</span>`+
      (state.sort===o.value?`<span class="lo-check">✓</span>`:"");
    pop.appendChild(b);
  });
  updateSortTrigger();
}
function updateSortTrigger(){
  const o=SORT_OPTIONS.find(x=>x.value===state.sort)||SORT_OPTIONS[0];
  document.getElementById("sortLabel").textContent=o.short;
  document.getElementById("sortDot").style.background=o.color;
}

function syncRangeUI(){
  document.querySelectorAll("#rangetabs button").forEach(b=>b.classList.toggle("active", b.dataset.range === state.range));
  const idx = {day:0, month:1, year:2}[state.range] || 0;
  document.getElementById("rangeThumb").style.transform = `translateX(${idx*100}%)`;
}

function renderSkeletons(n){
  const grid=document.getElementById("grid"); grid.innerHTML="";
  for(let i=0;i<n;i++){
    const d=document.createElement("div"); d.className="card skeleton";
    d.innerHTML=`<div class="card-top"><div class="sk-line" style="width:40%"></div><div class="sk-line" style="width:18%"></div></div>
      <div class="sk-line sk-title"></div><div class="sk-line" style="width:92%"></div><div class="sk-line" style="width:84%"></div>
      <div class="sk-line" style="width:60%; margin-top:6px"></div>`;
    grid.appendChild(d);
  }
}

function render(){
  let items = currentItems().filter(it => state.cat==="all" || it.category===state.cat);
  items = items.filter(it => state.lang==="all" || (it.extra&&it.extra.language)===state.lang);
  if(state.q){
    const q=state.q.toLowerCase();
    items=items.filter(it=>(it.title+" "+(it.category||"")+" "+(it.summary||"")+" "+(it.description||"")).toLowerCase().includes(q));
  }
  if(state.sort==="stars") items.sort((a,b)=>(b.extra?.stars||0)-(a.extra?.stars||0));
  else if(state.sort==="forks") items.sort((a,b)=>(b.extra?.forks||0)-(a.extra?.forks||0));
  else if(state.sort==="gain") items.sort((a,b)=>((b.deltas?.[state.range]?.stars)||0)-((a.deltas?.[state.range]?.stars)||0));
  else if(state.sort==="time") items.sort((a,b)=>(b.published||"").localeCompare(a.published||""));
  // "trend"（默认）：保持榜单内原有顺序，即已按复合趋势分降序

  // 全榜趋势分最大值，用于把条幅归一化到 0–100
  const maxScore = Math.max(1, ...currentItems().map(i => (i.scores ? i.scores[state.range] : 0)));

  const grid=document.getElementById("grid");
  if(!items.length){ grid.innerHTML='<div class="empty">没有匹配的内容。</div>'; return; }

  grid.innerHTML = items.map((it)=>{
    const w=Math.round((it.scores ? it.scores[state.range] : 0) / maxScore * 100);
    const color=CAT_COLOR[it.category]||"#cbd5e1";
    const summary = it.summary ? `<p class="summary">${esc(it.summary)}</p>` : `<p class="desc">${esc(it.description||"")}</p>`;
    const stars=(it.extra&&it.extra.stars!=null)?`★ ${fmtStars(it.extra.stars)}`:"";
    const forks=(it.extra&&it.extra.forks!=null)?it.extra.forks:0;
    const forkTxt = forks?`🍴 ${fmtStars(forks)}`:"";
    const lang=(it.extra&&it.extra.language)?`<span class="lang"><span class="d"></span>${esc(it.extra.language)}</span>`:"";
    const topics=(it.extra&&it.extra.topics)?it.extra.topics.slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join(""):"";

    // 主视觉：本周期 star 增量
    const d = (it.deltas && it.deltas[state.range]) || {stars:0, forks:0, est:false};
    const gainTxt = `+${fmtStars(d.stars)}⭐`;
    // 有真实历史→「当日/当月/当年 新增」；首日无基线→「日均 (估)」更诚实
    const gainEst = d.est
      ? `<small> (估)</small>`
      : "";
    const gainLbl = d.est ? `日均` : RANGE_GAIN_LBL[state.range];
    const forkGain = (d.forks>0) ? `<span class="fork">🍴 +${fmtStars(d.forks)}</span>` : "";

    // 排名变化
    let rc = "";
    const ch = it.rank_change;
    if(ch!=null && ch!==0){
      rc = ch>0 ? `<span class="rc up">▲${ch}</span>` : `<span class="rc down">▼${Math.abs(ch)}</span>`;
    }

    // 徽章
    let badges = "";
    if(it.is_new) badges += `<span class="badge new">🆕 新库</span>`;
    if(it.rank===1) badges += `<span class="badge fire">🥇 榜首</span>`;
    else if(it.rank<=3) badges += `<span class="badge fire">🔥 飙升</span>`;

    const fullDesc = (it.description||"").trim() ? `<p class="full">${esc(it.description)}</p>` : "";
    return `<article class="card" data-rank="${it.rank}" style="--swatch:${color}">
      <div class="card-top">
        <span class="cat"><span class="swatch"></span>${esc(it.category)}</span>
        <span class="rank">#${it.rank} ${rc}</span>
      </div>
      <h3><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h3>
      ${badges?`<div style="display:flex;gap:6px;flex-wrap:wrap">${badges}</div>`:""}
      <div class="gain">
        <span class="big">${gainTxt}</span>
        <span class="lbl">${gainLbl}${gainEst}</span>
        ${forkGain}
      </div>
      ${summary}
      <div class="meta">
        <span class="stars">${stars}</span>
        ${forkTxt?`<span class="forks">${forkTxt}</span>`:""}
        ${lang}
        <span class="date">${it.published||""}</span>
      </div>
      <div class="heat-wrap">
        <div class="heat"><div class="heat-bar" style="width:${w}%"></div></div>
        <span class="heat-num">趋势指数 ${w}%</span>
      </div>
      <div class="tags">${topics}</div>
      <div class="detail">
        ${fullDesc}
        <div class="acts">
          <a class="primary" href="${esc(it.url)}" target="_blank" rel="noopener">在 GitHub 查看</a>
          <a href="#" class="copy-link" data-url="${esc(it.url)}">复制链接</a>
        </div>
      </div>
    </article>`;
  }).join("");

  // 点击卡片展开详情（点链接/复制不触发）
  grid.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click", e=>{
      if(e.target.closest("a")) return;
      if(e.target.classList.contains("copy-link")){
        e.preventDefault(); e.stopPropagation();
        const u=e.target.dataset.url;
        navigator.clipboard?.writeText(u).then(()=>{ const o=e.target.textContent; e.target.textContent="已复制 ✓"; setTimeout(()=>e.target.textContent=o,1200); });
        return;
      }
      card.classList.toggle("open");
    });
  });

  // 滚动渐现
  const io=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
  },{threshold:.12});
  grid.querySelectorAll(".card").forEach((c,i)=>{ c.style.transitionDelay=(Math.min(i,8)*30)+"ms"; io.observe(c); });
}

/* 导出 Markdown 榜单 */
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const items=currentItems().filter(it=>state.cat==="all"||it.category===state.cat);
  const lines=[`# AI 热点趋势榜 · ${RANGE_LABEL[state.range]}最火（${fmtBeijing(DATA.generated_at||"").split("（")[0].trim()}）`,""];
  items.slice(0,30).forEach((it,i)=>{
    const ex=it.extra||{};
    const s=ex.stars!=null?` ★${fmtStars(ex.stars)}`:"";
    const f=ex.forks!=null?` 🍴${fmtStars(ex.forks)}`:"";
    const lg=ex.language?` · ${ex.language}`:"";
    const d=(it.deltas&&it.deltas[state.range])||{};
    const g=d.stars!=null?` · 本档 +${fmtStars(d.stars)}⭐`:"";
    lines.push(`${i+1}. **[${it.title}](${it.url})** · ${it.category}${lg}${s}${f}${g}`);
    if(it.summary) lines.push(`   - ${it.summary}`);
  });
  const blob=new Blob([lines.join("\n")],{type:"text/markdown"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ai-hotspot.md"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});

document.getElementById("rangetabs").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  state.range=b.dataset.range; state.cat="all";
  syncRangeUI(); buildStats(); buildCatFilter(); render();
  const thumb=document.getElementById("rangeThumb");
  thumb.classList.remove("flash"); void thumb.offsetWidth; thumb.classList.add("flash");
});
document.getElementById("sortTrigger").addEventListener("click", e=>{
  e.stopPropagation();
  document.getElementById("langFilter").classList.remove("open");
  document.getElementById("catFilter").classList.remove("open");
  document.getElementById("sortFilter").classList.toggle("open");
});
document.getElementById("sortPop").addEventListener("click", e=>{
  const o=e.target.closest(".lang-opt"); if(!o) return;
  state.sort=o.dataset.sort;
  document.querySelectorAll("#sortPop .lang-opt").forEach(x=>x.classList.toggle("active", x.dataset.sort===state.sort));
  updateSortTrigger();
  document.getElementById("sortFilter").classList.remove("open");
  render();
});
document.getElementById("search").addEventListener("input", e=>{ state.q=e.target.value; render(); });

/* 语言自定义下拉 */
document.getElementById("langTrigger").addEventListener("click", e=>{
  e.stopPropagation();
  document.getElementById("catFilter").classList.remove("open");
  document.getElementById("sortFilter").classList.remove("open");
  document.getElementById("langFilter").classList.toggle("open");
});
document.getElementById("langPop").addEventListener("click", e=>{
  const o=e.target.closest(".lang-opt"); if(!o) return;
  state.lang=o.dataset.lang;
  document.querySelectorAll("#langPop .lang-opt").forEach(x=>x.classList.toggle("active", x.dataset.lang===state.lang));
  updateLangTrigger();
  document.getElementById("langFilter").classList.remove("open");
  render();
});

/* 分类自定义下拉（同款色点下拉） */
document.getElementById("catTrigger").addEventListener("click", e=>{
  e.stopPropagation();
  document.getElementById("langFilter").classList.remove("open");
  document.getElementById("sortFilter").classList.remove("open");
  document.getElementById("catFilter").classList.toggle("open");
});
document.getElementById("catPop").addEventListener("click", e=>{
  const o=e.target.closest(".lang-opt"); if(!o) return;
  state.cat=o.dataset.cat;
  document.querySelectorAll("#catPop .lang-opt").forEach(x=>x.classList.toggle("active", x.dataset.cat===state.cat));
  updateCatTrigger();
  document.getElementById("catFilter").classList.remove("open");
  render();
});

/* 点击外部关闭任意下拉 */
document.addEventListener("click", e=>{
  ["langFilter","catFilter","sortFilter"].forEach(id=>{
    const el=document.getElementById(id);
    if(el.classList.contains("open") && !el.contains(e.target)) el.classList.remove("open");
  });
});

load();
</script>
</body>
</html>
