name: Build AI Hotspot

on:
  schedule:
    # 每天 00:00 与 12:00 UTC = 北京 08:00 与 20:00，各刷新一次榜单
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write      # 需要写回 stars_history.json（star 增量历史）
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 供 fetch_github 调用 GitHub API 认证 + 写回 star 历史
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      UPLOAD_HISTORY: "1"
      # 大模型摘要（未配置则走缓存 + 离线中文兜底，仍全中文）
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      FALLBACK_API_KEY: ${{ secrets.FALLBACK_API_KEY }}
      FALLBACK_BASE_URL: ${{ secrets.FALLBACK_BASE_URL }}
      FALLBACK_MODEL: ${{ secrets.FALLBACK_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Download star history
        continue-on-error: true
        run: |
          gh api repos/${{ github.repository }}/contents/stars_history.json --jq '.content' | base64 -d > stars_history.json || echo "no star history yet"

      - name: Aggregate & summarize
        run: python scripts/fetch.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
